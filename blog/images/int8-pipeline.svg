<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" font-family="'Helvetica Neue', 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Node 1: PyTorch -->
  <g>
    <rect x="20" y="60" width="180" height="90" rx="10" fill="#fff5f2" stroke="#ee4c2c" stroke-width="2"/>
    <text x="110" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">PyTorch</text>
    <text x="110" y="115" text-anchor="middle" font-size="12" fill="#6b7280">訓練框架</text>
    <text x="110" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#ee4c2c">.pt</text>
  </g>

  <!-- Arrow 1 -->
  <g>
    <line x1="205" y1="105" x2="248" y2="105" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
    <text x="226" y="95" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">export</text>
  </g>

  <!-- Node 2: ONNX -->
  <g>
    <rect x="255" y="60" width="180" height="90" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="345" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">ONNX</text>
    <text x="345" y="115" text-anchor="middle" font-size="12" fill="#6b7280">通用格式（FP32）</text>
    <text x="345" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#7c3aed">.onnx</text>
  </g>

  <!-- Arrow 2 -->
  <g>
    <line x1="440" y1="105" x2="483" y2="105" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
    <text x="461" y="95" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">quantize</text>
  </g>

  <!-- Node 3: ORT quantize_static -->
  <g>
    <rect x="490" y="60" width="200" height="90" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="590" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">ORT</text>
    <text x="590" y="106" text-anchor="middle" font-size="12" font-family="monospace" fill="#3b82f6">quantize_static</text>
    <text x="590" y="128" text-anchor="middle" font-size="11" fill="#6b7280">插入 QDQ 節點</text>
    <text x="590" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#3b82f6">.onnx (QDQ)</text>
  </g>

  <!-- Arrow 3 -->
  <g>
    <line x1="695" y1="105" x2="738" y2="105" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
    <text x="716" y="95" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">build</text>
  </g>

  <!-- Node 4: TensorRT engine -->
  <g>
    <rect x="745" y="60" width="195" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="842" y="92" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">TensorRT</text>
    <text x="842" y="115" text-anchor="middle" font-size="12" fill="#6b7280">INT8 推論引擎</text>
    <text x="842" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#16a34a">.engine</text>
  </g>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">
    INT8 量化的主流路徑
  </text>

  <!-- Bottom note -->
  <text x="480" y="185" text-anchor="middle" font-size="11" fill="#9ca3af" font-style="italic">
    量化階段用 ORT ｜ 推論階段用 TensorRT ｜ ONNX 是兩邊的橋樑
  </text>
</svg>
